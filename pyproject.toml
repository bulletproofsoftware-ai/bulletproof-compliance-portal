[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compliance-portal"
version = "0.1.0"
description = "Compliance portal — FastAPI + HTMX foundation (PRD-19)"
requires-python = ">=3.12"
authors = [{ name = "bulletproofsoftware-ai" }]
license = { text = "Proprietary" }
readme = "README.md"
dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.32.0,<0.33.0",
    "jinja2>=3.1.4,<3.2.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "httpx>=0.27.0,<0.28.0",
    "python-multipart>=0.0.12,<0.1.0",
    "structlog>=24.4.0,<25.0.0",
    "orjson>=3.10.0,<4.0.0",
    "asyncpg>=0.30.0,<0.31.0",
    "sqlalchemy>=2.0.36,<2.1.0",
    "alembic>=1.13.3,<1.14.0",
    "authlib>=1.3.2,<1.4.0",
    "itsdangerous>=2.2.0,<2.3.0",
    "cryptography>=43.0.0,<44.0.0",
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "redis>=5.1.0,<6.0.0",
    "slowapi>=0.1.9,<0.2.0",
    "prometheus-client>=0.21.0,<0.22.0",
    "starlette>=0.41.0,<0.42.0",
    # WI-19 — PDF Export Service (cross-cutting; required for REQ-CPL-045)
    # Native deps required: cairo, pango, gdk-pixbuf (brew install cairo pango gdk-pixbuf libffi)
    "weasyprint>=63.0,<70.0",
    "pikepdf>=9.4.0,<11.0",
    "pyHanko>=0.25.0,<0.40.0",
    "Brotli>=1.1.0,<2.0.0",
    "cachetools>=5.5.0,<10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<0.25.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "ruff>=0.7.0,<0.8.0",
    "mypy>=1.13.0,<2.0.0",
    "respx>=0.21.1,<0.22.0",
    "freezegun>=1.5.0,<2.0.0",
    "fakeredis>=2.26.0,<3.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["portal*", "shared*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "S101"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = false
plugins = ["pydantic.mypy"]
