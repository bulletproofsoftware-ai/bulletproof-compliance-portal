<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Identity proof uploaded</title>
  <style>
    body { font: 16px/1.5 -apple-system, BlinkMacSystemFont, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    .panel { border: 1px solid #e5e7eb; padding: 1rem; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>Identity proof received</h1>
  <div class="panel">
    <p>Reference: <strong>{{ reference }}</strong></p>
    <p>Scan status: <strong>{{ scan_status }}</strong></p>
    <p>Our compliance team will review your proof and contact you via the email
       address on file. Please do not submit duplicate uploads.</p>
  </div>
</body>
</html>
