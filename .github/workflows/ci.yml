name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          [ -f requirements.txt ] && pip install -r requirements.txt || echo "no requirements.txt"
          [ -f app/requirements.txt ] && pip install -r app/requirements.txt || true
      - name: Syntax check (compile all Python)
        run: |
          python -m compileall -q $(git ls-files '*.py') || python -m compileall -q .
      # The package lives under src/. tests/conftest.py also inserts it into
      # sys.path, so PYTHONPATH here is defence in depth for any invocation
      # that bypasses conftest. Failures FAIL the build — the suite runs
      # entirely in-process and needs no external services.
      # SEC-EX-001 preconditions (CISO condition C1). The bleach ReDoS
      # (SNYK-PYTHON-BLEACH-17356127) is accepted ONLY because its vulnerable path
      # requires parse_email=True, which this codebase never passes. Run these
      # first and by name so the gate is visible and cannot be lost inside a broad
      # test run. If this step fails, SEC-EX-001 is VOID — escalate, do not patch
      # the test.
      - name: Security exception guards (SEC-EX-001)
        env:
          PYTHONPATH: src
        run: pytest tests/test_markdown_render_guard.py -q

      - name: Tests
        env:
          PYTHONPATH: src
        run: pytest -q
