# WI-18 — Internal portal nginx reverse proxy (Netbird/Tailscale-bound).
#
# Listens on 8443 (TLS) inside the container; the Compose binding exposes this
# only on 127.0.0.1:8443 of the host. Real production deployments place this
# behind Netbird or Tailscale where peer access is authenticated.
#
# AMD-21: explicit ssl_protocols (TLS 1.2 + 1.3 only) and modern cipher suite.
# AMD-11: reasonable internal upload size (16M for evidence packages).

worker_processes  1;
events { worker_connections 1024; }

http {
    log_format json_combined escape=json
        '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"x_forwarded_for":"$http_x_forwarded_for",'
        '"request":"$request",'
        '"status":$status,'
        '"bytes_sent":$bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"http_user_agent":"$http_user_agent",'
        '"request_id":"$http_x_request_id"'
        '}';

    access_log /var/log/nginx/access.log json_combined;
    error_log  /var/log/nginx/error.log  warn;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    server_tokens      off;

    # AMD-11: internal portal accepts evidence uploads up to 16MB.
    client_max_body_size      16m;
    client_body_buffer_size   256k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;

    # Internal complementary rate limit (in-app SlowAPI is the primary).
    limit_req_zone $binary_remote_addr zone=internal_rl:10m rate=600r/m;

    upstream internal_portal_upstream {
        server portal:8001 max_fails=3 fail_timeout=10s;
        keepalive 8;
    }

    server {
        listen 8443 ssl http2;
        server_name internal.localhost;

        # ── AMD-21: TLS hardening ────────────────────────────────────────────
        ssl_certificate     /etc/nginx/certs/internal.crt;
        ssl_certificate_key /etc/nginx/certs/internal.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        # OCSP stapling — production only; relies on a chain bundle.
        ssl_stapling        on;
        ssl_stapling_verify on;
        resolver            127.0.0.11 valid=300s;
        resolver_timeout    5s;

        # ── HSTS + standard hardening headers ────────────────────────────────
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

        # ── Forward client cert headers for downstream mTLS to compliance ───
        # When the edge terminates mTLS to operator clients and re-presents a
        # client cert toward the upstream compliance service, the portal needs
        # these headers so the in-app ComplianceClient can attach them.
        proxy_set_header X-SSL-Client-Verify  $ssl_client_verify;
        proxy_set_header X-SSL-Client-Subject $ssl_client_s_dn;
        proxy_set_header X-SSL-Client-Issuer  $ssl_client_i_dn;

        # local-dev: relax CSP on /docs, /redoc, oauth2-redirect so swagger-ui CDN assets load.
        location ~ ^/(docs|redoc|docs/oauth2-redirect)$ {
            limit_req zone=internal_rl burst=120 nodelay;
            proxy_hide_header Content-Security-Policy;
            add_header Content-Security-Policy "default-src 'self' https://cdn.jsdelivr.net https://fastapi.tiangolo.com; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
            proxy_pass         http://internal_portal_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host  $host;
            proxy_set_header   X-Request-ID      $http_x_request_id;
            proxy_set_header   Connection        "";
        }

        location / {
            limit_req zone=internal_rl burst=120 nodelay;

            proxy_pass         http://internal_portal_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host  $host;
            proxy_set_header   X-Request-ID      $http_x_request_id;
            proxy_set_header   Connection        "";
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_connect_timeout 5s;
        }

        location = /healthz {
            access_log off;
            proxy_pass http://internal_portal_upstream/healthz;
        }
    }
}
