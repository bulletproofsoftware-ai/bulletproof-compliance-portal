# Public DSR portal nginx reverse proxy (internet-facing).
#
# Hardened configuration for the public DSR portal:
#   - client_max_body_size 4m; client_body_buffer_size 128k
#       (application enforces an additional 5MB cap; nginx draws the outer
#        edge tighter for the public listener since DSR identity proofs
#        should never exceed 4MB after compression)
#   - ssl_protocols TLSv1.2 TLSv1.3 + cipher pinning
#   - Strict rate limit (100 req/min/IP) at edge — defence in depth
#   - Basic regex WAF rules (SQLi / XSS / path traversal patterns)
#   - X-Robots-Tag noindex (public DSR portal is not search-indexed)

worker_processes  1;
events { worker_connections 1024; }

http {
    log_format json_combined escape=json
        '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"x_forwarded_for":"$http_x_forwarded_for",'
        '"request":"$request",'
        '"status":$status,'
        '"bytes_sent":$bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"http_user_agent":"$http_user_agent",'
        '"request_id":"$http_x_request_id"'
        '}';

    access_log /var/log/nginx/access.log json_combined;
    error_log  /var/log/nginx/error.log  warn;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    server_tokens      off;

    # Security control: public listener — 4MB max body, 128k buffer.
    client_max_body_size      4m;
    client_body_buffer_size   128k;
    client_header_buffer_size 2k;
    large_client_header_buffers 4 8k;

    # Tight rate limit at edge.
    limit_req_zone $binary_remote_addr zone=public_rl:10m rate=100r/m;
    limit_conn_zone $binary_remote_addr zone=public_conn:10m;

    upstream public_portal_upstream {
        server dsr_portal:8002 max_fails=3 fail_timeout=10s;
        keepalive 4;
    }

    # ── Basic WAF — block obvious SQLi / XSS / path traversal patterns ───────
    # This is NOT a substitute for ModSecurity/Coraza; it is a defence-in-depth
    # layer to filter the lowest-effort scanners and bots.
    map $request_uri $waf_bad_request_uri {
        default 0;
        "~*\\.\\./"                           1;   # path traversal ../
        "~*<script"                            1;   # naive XSS
        "~*\\bunion\\s+select\\b"             1;   # SQLi UNION SELECT
        "~*\\b(or|and)\\s+1\\s*=\\s*1\\b"   1;   # SQLi tautology
        "~*\\bsleep\\s*\\(\\d+\\)"            1;   # blind SQLi
    }
    map $http_user_agent $waf_bad_ua {
        default 0;
        "~*sqlmap"     1;
        "~*nikto"      1;
        "~*acunetix"   1;
    }

    server {
        listen 8444 ssl http2;
        server_name dsr.localhost;

        # ── TLS hardening (matches internal posture) ─────────────────────────
        ssl_certificate     /etc/nginx/certs/public.crt;
        ssl_certificate_key /etc/nginx/certs/public.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        ssl_stapling        on;
        ssl_stapling_verify on;
        resolver            127.0.0.11 valid=300s;
        resolver_timeout    5s;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header Referrer-Policy           "no-referrer" always;
        add_header X-Robots-Tag              "noindex, nofollow" always;
        add_header Permissions-Policy        "interest-cohort=()" always;

        # ── WAF gate ─────────────────────────────────────────────────────────
        if ($waf_bad_request_uri) {
            return 403;
        }
        if ($waf_bad_ua) {
            return 403;
        }

        location / {
            limit_req  zone=public_rl burst=20 nodelay;
            limit_conn public_conn 10;

            proxy_pass         http://public_portal_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host  $host;
            proxy_set_header   X-Request-ID      $http_x_request_id;
            proxy_set_header   Connection        "";
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_connect_timeout 5s;
        }

        location = /healthz {
            access_log off;
            proxy_pass http://public_portal_upstream/healthz;
        }
    }
}
